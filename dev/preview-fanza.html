<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DLsite Price Tracker — FANZA ページのプレビュー</title>
<!-- 拡張の実ファイルをそのまま読み込む。コピーを置かないこと（乖離の元） -->
<link rel="stylesheet" href="/src/content/panel.css">
<style>
  body { margin: 0; padding: 24px; background: #f2f4f3; font-family: "Hiragino Sans", Meiryo, system-ui, sans-serif; color: #222; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .note { margin: 0 0 18px; padding: 10px 14px; border-left: 3px solid #10b981; background: #fff; font-size: 13px; line-height: 1.7; }
  .fake { padding: 14px; border: 1px dashed #c8d0cd; border-radius: 8px; background: #fff; color: #8a938f; font-size: 12px; }
  h1 { margin: 0 0 6px; font-size: 18px; }
  /* FANZA 同人詳細の骨格を模す（2026-08 実測: l-areaMainColumn 直下に縦積み） */
  .l-areaProductTitle { margin: 0 0 12px; }
  .l-areaVariableBoxWrap .fake { display: flex; align-items: center; justify-content: center; height: 300px; }
  .l-areaProductInfo { margin: 12px 0; }
  .l-areaProductSummary { margin: 12px 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #0e1113; color: #e5e7eb; }
    .note, .fake { background: #16191c; border-color: #2c3237; color: #9ca3af; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>DLsite Price Tracker — FANZA 作品ページのプレビュー</h1>
  <p class="note">
    FANZA 同人の詳細ページと同じ DOM 骨格（<code>.l-areaProductInfo</code> の直後に
    パネルが入るのが正解）。API の代わりに <code>dev/fixture-d_705340.json</code> を返します。
  </p>

  <div class="l-areaMainColumn">
    <div class="l-areaProductTitle">
      <div class="fake">（タイトル・販売数・評価・サークルの位置）</div>
    </div>
    <div class="l-areaVariableBoxWrap">
      <div class="fake">（プレビュー画像スライダーの位置）</div>
    </div>
    <div class="l-areaProductInfo">
      <div class="m-productSales"><div class="fake">（価格表示の位置）</div></div>
      <div class="m-productInformation"><div class="fake">（配信開始日・シリーズ・ジャンルの情報リストの位置）</div></div>
    </div>
    <div class="l-areaPromotionBnr"><div class="fake">（プロモバナーの位置）</div></div>
    <div class="l-areaProductSummary"><div class="fake">（作品紹介文の位置）</div></div>
  </div>
</div>

<script>
// ── chrome.* のスタブ。preview.html と同じ足場の FANZA 版 ──
(() => {
  const mem = {};
  let fixture = null;

  window.chrome = {
    storage: {
      local: {
        async get(key) {
          if (key === null) return { ...mem };
          const keys = Array.isArray(key) ? key : [key];
          const out = {};
          for (const k of keys) if (k in mem) out[k] = mem[k];
          return out;
        },
        async set(obj) { Object.assign(mem, obj); },
        async remove(keys) { for (const k of [].concat(keys)) delete mem[k]; },
      },
    },
    runtime: {
      getManifest: () => ({ version: "0.2.0" }),
      async sendMessage(msg) {
        if (msg.type === "UPDATE_CHECK") return { latest: null, hasUpdate: false };
        if (msg.type !== "PRICE_HISTORY") return null;
        if (!fixture) fixture = await (await fetch("/dev/fixture-d_705340.json")).json();
        return { ok: true, data: JSON.parse(JSON.stringify(fixture)), status: 200 };
      },
    },
  };

  // FANZA の作品ページ判定を通すため、URL に cid を含める
  history.replaceState({}, "", "/dc/doujin/-/detail/=/cid=d_705340/");
})();
</script>

<script src="/src/lib/dom.js"></script>
<script src="/src/lib/format.js"></script>
<script src="/src/lib/chart.js"></script>
<script src="/src/lib/watchlist.js"></script>
<script src="/src/content/work-page.js"></script>
</body>
</html>
