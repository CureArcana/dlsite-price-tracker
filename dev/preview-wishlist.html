<!doctype html>
<html lang="ja">
<head>

<title>DLsite Price Tracker — お気に入りバーのプレビュー</title>
<!-- 実ページと同じ判定を通すため、URL に mypage/wishlist を含める必要がある。
     history.replaceState でパスを差し替える（相対パスの解決先も変わるので、
     スクリプトは全部ルート絶対パスで書くこと。v0.1.0 で 404 を出した罠）。 -->
<script>history.replaceState({}, "", "/maniax/mypage/wishlist");</script>
<style>
  body { margin:0; padding:24px; font-family:"Hiragino Sans",Meiryo,system-ui,sans-serif;
         background:#fff; color:#1f2937; }

  .note { color:#6b7280; font-size:12px; max-width:52em; }
  #main_inner { margin-top:16px; }
  .row { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #eee; align-items:center; }
  .row img { width:56px; height:42px; background:#dfe6e3; }
  .work_name a { color:#1f2937; font-size:13px; }
  @media (prefers-color-scheme: dark) {
    body { background:#101215; color:#e5e7eb; }
    .work_name a { color:#e5e7eb; }
    .row { border-color:#2c3237; }
  }
</style>
</head>
<body>
<h1>お気に入りバーのプレビュー</h1>
<p class="note">
  DLsite のお気に入りページを模した DOM に、<code>src/content/wishlist-page.js</code> を
  そのまま読み込んでいます。<code>harvestWorks()</code> が作品ID とタイトルを拾えるか、
  一括追加が効くかをここで確かめます。
</p>

  <div class="row">

</html>
