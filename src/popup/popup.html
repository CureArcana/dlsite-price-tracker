<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DLsite Price Tracker — ウォッチリスト</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <h1>ウォッチリスト</h1>
      <p class="sub" id="summary">読み込んでいます…</p>
    </header>

    <div class="bar">
      <button type="button" id="check" class="btn btn-primary">今すぐ確認</button>
      <button type="button" id="clear" class="btn btn-quiet">すべて解除</button>
    </div>

    <p class="status" id="status" role="status"></p>

    <ul class="list" id="list"></ul>

    <p class="empty" id="empty" hidden>
      まだ登録がありません。<br />
      DLsite の作品ページで「安くなったら通知」を押すと、ここに並びます。
      お気に入りページからまとめて追加することもできます。
    </p>

    <footer class="foot">
      <p>登録内容はこの端末内だけに保存されます。サーバーには作品IDしか送信しません。</p>
      <p>価格は日次観測にもとづく参考値です。実際の販売価格は DLsite の表示が正となります。</p>
    </footer>

    <script src="../lib/watchlist.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
