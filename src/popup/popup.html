<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DLsite Price Tracker — ウォッチリスト</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <h1>ウォッチリスト</h1>
      <p class="sub" id="summary">読み込んでいます…</p>
    </header>

    <div class="bar">
      <button type="button" id="check" class="btn btn-primary">今すぐ確認</button>
      <button type="button" id="clear" class="btn btn-quiet">すべて解除</button>
    </div>

    <p class="status" id="status" role="status"></p>

    <div class="filters">
      <input type="search" id="q" class="search" placeholder="タイトルで絞り込み" aria-label="タイトルで絞り込み" />
      <div class="chips" id="chips" role="group" aria-label="表示する登録の種類">
        <button type="button" class="chip is-active" data-filter="all" aria-pressed="true">すべて</button>
        <button type="button" class="chip" data-filter="discount" aria-pressed="false">割引中</button>
        <button type="button" class="chip" data-filter="lowest" aria-pressed="false">過去最安</button>
        <button type="button" class="chip" data-filter="notified" aria-pressed="false">通知済み</button>
      </div>
    </div>

    <ul class="list" id="list"></ul>

    <p class="empty" id="empty" hidden>
      まだ登録がありません。<br />
      DLsite の作品ページで「安くなったら通知」を押すと、ここに並びます。
      お気に入りページからまとめて追加することもできます。
    </p>

    <p class="empty" id="no-match" hidden>条件に合う登録がありません</p>

    <script src="../lib/watchlist.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
